name: Build and publish Play internal release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: Optional version name; default is app version plus workflow run number
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: play-internal-release
  cancel-in-progress: false
  queue: max

env:
  PACKAGE_NAME: com.ivicastojanoski.miniscore

jobs:
  build:
    name: Test and build signed AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Assign release versions
        id: version
        env:
          VERSION_NAME_OVERRIDE: ${{ inputs.version_name }}
          VERSION_CODE_OFFSET: ${{ vars.PLAY_VERSION_CODE_OFFSET || '1000' }}
        run: |
          python scripts/play_release_version.py \
            --run-number "$GITHUB_RUN_NUMBER" --offset "$VERSION_CODE_OFFSET" \
            --version-name "$VERSION_NAME_OVERRIDE" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21" # Match the Android 36 Robolectric test runtime.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.6.1"
      - name: Install Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install target platform and build tools
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Restore Android signing keys
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]] || { echo "Missing Android upload key secret."; exit 1; }
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-key.jks
          chmod 600 upload-key.jks
          base64 --decode debug.keystore.base64 > debug.keystore
      - name: Run unit tests
        run: gradle --no-daemon --no-configuration-cache testDebugUnitTest
      - name: Build signed release bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          [[ -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]
          gradle --no-daemon --no-configuration-cache lintVitalRelease bundleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Save signed AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miniscore-internal-aab-${{ github.run_id }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Summarize signed release
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          {
            echo "Signed Miniscore $VERSION_NAME (code $VERSION_CODE) from $GITHUB_SHA."
            sha256sum app/build/outputs/bundle/release/app-release.aab
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing key
        if: always()
        run: rm -f upload-key.jks debug.keystore

  publish:
    name: Publish to Play Internal testing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: google-play-internal
    steps:
      - name: Download signed AAB
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: miniscore-internal-aab-${{ github.run_id }}
          path: release
      - name: Check Play publishing credential
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$SERVICE_ACCOUNT_JSON" ]]; then
            echo 'Missing google-play-internal secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON. Configure app access and the first manual Play upload before retrying this publish job.'
            exit 1
          fi
      - name: Publish internal release
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: release/app-release.aab
          tracks: internal
          status: completed
          releaseName: Miniscore ${{ needs.build.outputs.version_name }} (${{ needs.build.outputs.version_code }})
