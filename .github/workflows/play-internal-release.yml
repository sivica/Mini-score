name: Build and publish Play internal release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Unused version code, greater than the latest Play release
        required: true
        type: string
      version_name:
        description: User-facing release version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: play-internal-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.ivicastojanoski.miniscore

jobs:
  build:
    name: Test and build signed AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Validate release versions
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] && (( VERSION_CODE <= 2100000000 ))
          [[ -n "$VERSION_NAME" ]]
      - name: Restore Android signing keys
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]] || { echo "Missing Android upload key secret."; exit 1; }
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-key.jks
          chmod 600 upload-key.jks
          base64 --decode debug.keystore.base64 > debug.keystore
      - name: Run unit tests
        run: gradle --no-daemon --no-configuration-cache testDebugUnitTest
      - name: Build signed release bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          [[ -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]
          gradle --no-daemon --no-configuration-cache bundleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Save signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: miniscore-internal-aab-${{ github.run_id }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f upload-key.jks

  publish:
    name: Publish to Play Internal testing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: google-play-internal
    steps:
      - name: Download signed AAB
        uses: actions/download-artifact@v4
        with:
          name: miniscore-internal-aab-${{ github.run_id }}
          path: release
      - name: Publish internal release
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: release/app-release.aab
          tracks: internal
          status: completed
